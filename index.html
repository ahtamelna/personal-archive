:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}.search:before{content:"SEARCH / FILTER";display:flex;align-items:center;padding:0 10px;border:1px solid var(--line);background:#e9e5db;color:var(--muted);font-size:9px;letter-spacing:.1em;font-weight:bold}.search select{appearance:none;border:1px solid var(--line);background:#f8f5ec;padding:9px 34px 9px 10px;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}.field textarea{min-height:110px;resize:vertical}.field textarea{min-height:110px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:11px 0}.row:first-child{border-top:0}.list{display:grid}.status{font-size:9px;padding:3px 6px;border:1px solid var(--line)}.public{color:var(--accent)}.private{color:var(--warn)}.calendar-wrap{overflow:auto}.calendar{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);min-width:735px}.day{min-height:105px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;background:#fbf9f2}.day.other{background:#efede5;color:#999}.day.today{box-shadow:inset 0 0 0 2px var(--accent)}.day b{font-size:11px}.event{font-size:10px;background:var(--accent2);margin-top:5px;padding:4px}.article-body{line-height:1.85;font-size:14px}.article-body img{max-width:100%;height:auto}.article-body iframe{max-width:100%}.article-body blockquote{border-left:3px solid var(--accent);padding-left:14px;color:var(--muted)} <body>
<div class="app"><div class="shell">
<header class="site-header"><div class="top"><div class="seal" aria-label="Personal Archive emblem"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#f1eee5" stroke="#252a28" stroke-width="4"/><path d="M18 18h28v28H18z" fill="none" stroke="#315a52" stroke-width="4"/><path d="M23 25h18M23 32h18M23 39h12" stroke="#315a52" stroke-width="3"/></svg></div><div class="brand"><h1 id="siteTitle">Personal Archive</h1><p id="siteSubtitle">A private digital record and public reading room.</p></div></div><div id="notice" class="notice"><span id="noticeText" class="ticker"></span></div><nav id="nav" class="nav"></nav></header>
</div>
<main><div class="shell">
<section id="home" class="page active"></section><section id="featured" class="page"></section><section id="articles" class="page"></section><section id="archive" class="page"></section><section id="calendar" class="page"></section><section id="about" class="page"></section><section id="contact" class="page"></section><section id="searchPage" class="page"></section><section id="dynamicPages" class="page"></section><section id="admin" class="page"></section>
</div></main>
<footer><span id="footerLeft">Personal Digital Archive</span><span id="footerRight">Archive interface</span></footer></div>
<div id="modal" class="modal"><div id="modalBox" class="modal-box"></div></div><div id="toast" class="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateEmail,updatePassword,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,getDocs,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAtTqBLIFie2lDy1_94osAXWRCLBUMrFIQ",authDomain:"personalarchive7.firebaseapp.com",projectId:"personalarchive7",storageBucket:"personalarchive7.firebasestorage.app",messagingSenderId:"628166318645",appId:"1:628166318645:web:61b713a512aee20d0c6f7c"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let state={settings:{title:"Personal Archive",subtitle:"A private digital record and public reading room.",about:"",contact:"",footer:"Personal Digital Archive",notice:{show:false,text:""},homeFeatured:{title:"",subtitle:"",body:""}},articles:[],files:[],events:[],pages:[],links:[],admin:null,github:{owner:"",repo:"",branch:"main",token:""},ready:false,currentPage:"home",calendarDate:new Date(),unsub:[]};
const slugify=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-").slice(0,80);
const authEmail=u=>`${String(u).trim().toLowerCase().replace(/[^a-z0-9._-]/g,"-")}@pa-login.invalid`;
const fmt=d=>d?.toDate?d.toDate().toLocaleDateString():new Date(d||Date.now()).toLocaleDateString();
const toast=m=>{toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2600)};
const toastEl=$("toast");
function setLoading(id){$(id).innerHTML='<div class="loading">Loading archive records…</div>'}
function showModal(html){$("modalBox").innerHTML=html;$("modal").classList.add("show")};function closeModal(){$("modal").classList.remove("show")};window.closeModal=closeModal;
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function activePublicPages(){return state.pages.filter(p=>p.public)}
function renderNav(){let items=[["home","Home"],["featured","Featured"],["articles","Articles"],["archive","Archive"],["calendar","Calendar"],["about","About"],["contact","Contact"]];items.push(...activePublicPages().filter(p=>p.nav!==false).map(p=>[`page:${p.slug}`,p.title]));items.push(...state.links.filter(l=>l.show!==false).map(l=>[`link:${l.id}`,l.title]));items.push(["searchPage","Search"]);if(state.admin)items.push(["admin","Admin dashboard"]);$("nav").innerHTML=items.map(([id,t])=>`<button class="${state.currentPage===id?'active':''}" data-nav="${esc(id)}">${esc(t)}</button>`).join("");document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{let id=b.dataset.nav;if(id.startsWith("link:")){let l=state.links.find(x=>x.id===id.slice(5));if(l)window.open(l.url,"_blank","noopener");return}go(id)});}
function go(id){state.currentPage=id;document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));let target=id.startsWith("page:")?"dynamicPages":id;$(target).classList.add("active");render();scrollTo({top:0,behavior:"smooth"})};window.go=go;
function articleCard(a){return `<article class="card"><span class="tag">${esc(a.category||"article")}</span><h3>${esc(a.title)}</h3><p>${esc(a.summary||"")}</p><div class="meta">${esc(a.date||fmt(a.createdAt))}</div><br><button class="btn" data-read="${a.id}">Read more</button></article>`}
function renderHome(){let fa=state.files.filter(f=>f.public&&f.featured).slice(0,4);let todayEvents=state.events.filter(e=>e.public&&e.date===today());let hf=state.settings.homeFeatured||{};$('home').innerHTML=`<div class="crumb">PUBLIC READING ROOM / INDEX</div><div class="grid"><div class="panel hero"><div><div class="eyebrow">${esc(hf.title||'Personal digital archive')}</div><h2>${esc(hf.subtitle||'A personal archive, organized for the long term.')}</h2><div class="article-body">${hf.body||'<p>Articles, documents, media and records in one searchable place.</p>'}</div></div><div class="actions"><button class="btn primary" onclick="go('articles')">Browse articles</button><button class="btn" onclick="go('archive')">Browse archive</button></div></div><div class="panel"><div class="eyebrow">Today</div>${todayEvents.length?`<div class="card" style="margin:10px 0"><span class="tag">Today's action</span><h3>${esc(todayEvents[0].title)}</h3><p>${esc(todayEvents[0].notes||'')}</p></div>`:'<p>No public action is scheduled today.</p>'}<div class="row"><span>Public articles</span><b>${state.articles.filter(a=>a.public).length}</b></div><div class="row"><span>Public files</span><b>${state.files.filter(f=>f.public).length}</b></div><div class="row"><span>Upcoming events</span><b>${state.events.filter(e=>e.public&&e.date>=today()).length}</b></div></div></div><div class="panel" style="margin-top:16px"><div class="admin-head"><h3>Featured archive</h3><button class="btn small" onclick="go('archive')">View archive</button></div><div class="archive-grid">${fa.map(f=>`<div class="card"><span class="tag">${esc(f.type)}</span><h3>${esc(f.title)}</h3><p>${esc(f.description||'')}</p><div class="meta">${esc(f.name||'')}</div><br><button class="btn" onclick="previewFile('${f.id}')">Preview</button></div>`).join('')||'<p>No featured archive files.</p>'}</div></div>`}
function today(){return new Date().toISOString().slice(0,10)}
function renderArticles(){let arr=state.articles.filter(a=>a.public);$("articles").innerHTML=`<div class="crumb">ARTICLES / PUBLICATIONS</div><div class="panel"><h2>Articles</h2><p>Only summaries are shown here. Open a record to read the complete article.</p><div class="cards">${arr.map(articleCard).join("")||"<p>No public articles yet.</p>"}</div></div>`;bindReads()}
function bindReads(){document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>openArticle(b.dataset.read))}
function openArticle(id){let a=state.articles.find(x=>x.id===id);if(!a||!a.public)return;state.currentPage="article:"+id;document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$("home").classList.add("active");$("home").innerHTML=`<div class="crumb">ARTICLES / RECORD</div><article class="panel"><div class="eyebrow">${esc(a.category||"Article")} • ${esc(a.date||fmt(a.createdAt))}</div><h2 style="font:700 36px Georgia,serif">${esc(a.title)}</h2>${a.subtitle?`<p><strong>${esc(a.subtitle)}</strong></p>`:""}<hr style="border:0;border-top:1px solid var(--line)"><div class="article-body">${a.body||""}</div><br><button class="btn" onclick="go('articles')">Back to articles</button></article>`;renderNav()}
function fileUrl(f){let p=f.githubPath||f.path||'';if(p&&!/^https?:\/\//i.test(p)){let base=location.href.split('#')[0];if(!base.endsWith('/'))base=base.substring(0,base.lastIndexOf('/')+1);return new URL(p,base).href}if(f.url)return f.url;return p}
async function renderArchive(){let arr=state.files.filter(f=>f.public);$("archive").innerHTML=`<div class="crumb">ARCHIVE / CATALOGUE</div><div class="panel"><div class="search"><input id="archiveQ" placeholder="Search the catalogue…"><select id="typeQ"><option value="">All types</option><option>image</option><option>pdf</option><option>video</option><option>audio</option><option>text</option><option>other</option></select></div><div id="archiveList" class="list"></div></div>`;let draw=()=>{let q=(archiveQ.value||"").toLowerCase(),t=typeQ.value;let out=arr.filter(x=>(!q||(x.title+" "+(x.description||"")+" "+(x.name||"")).toLowerCase().includes(q))&&(!t||x.type===t)).map(x=>`<div class="row"><span><b>${esc(x.title)}</b><div class="meta">${esc(x.type)} • ${esc(x.name||"")}</div></span><button class="btn" data-preview="${x.id}">Preview</button></div>`).join("")||"<p>No matching public records.</p>";archiveList.innerHTML=out;document.querySelectorAll("[data-preview]").forEach(b=>b.onclick=()=>previewFile(b.dataset.preview))};archiveQ.oninput=draw;typeQ.onchange=draw;draw()}
function previewFile(id){let f=state.files.find(x=>x.id===id);if(!f)return;let url=fileUrl(f),media='';if(url){if(f.type==='image')media=`<img src="${esc(url)}" style="max-width:100%;max-height:650px;object-fit:contain">`;else if(f.type==='video')media=`<video src="${esc(url)}" controls playsinline style="max-width:100%;width:100%"></video>`;else if(f.type==='audio')media=`<audio src="${esc(url)}" controls style="width:100%"></audio>`;else if(f.type==='pdf')media=`<iframe src="${esc(url)}#toolbar=0&navpanes=0&view=FitH" title="${esc(f.title)}" style="width:100%;height:70vh;min-height:520px;border:1px solid var(--line);background:#fff"></iframe>`;else if(f.type==='text')media=`<iframe src="${esc(url)}" title="${esc(f.title)}" style="width:100%;height:500px;border:1px solid var(--line)"></iframe>`}showModal(`<div class="modal-head"><div><div class="eyebrow">${esc(f.type)}</div><h2>${esc(f.title)}</h2></div><button class="btn small" onclick="closeModal()">Close</button></div><p>${esc(f.description||'')}</p>${media||'<p>No browser preview is available for this record.</p>'}${f.downloadable&&url?`<br><a class="btn" href="${esc(url)}" target="_blank" rel="noopener" download>Download</a>`:''}`)}
function renderCalendar(){let d=state.calendarDate,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells="";for(let i=0;i<first;i++)cells+=`<div class="day other"></div>`;for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,ev=state.events.filter(e=>e.public&&e.date===ds);cells+=`<div class="day ${ds===today()?"today":""}"><b>${n}</b>${ev.map(e=>`<div class="event">${esc(e.title)}</div>`).join("")}</div>`}$("calendar").innerHTML=`<div class="crumb">CALENDAR / PUBLIC EVENTS</div><div class="panel"><div class="admin-head"><div><h2>${d.toLocaleString(undefined,{month:"long",year:"numeric"})}</h2><div class="toolbar-note">Public events only</div></div><div class="actions"><button class="btn" onclick="changeMonth(-1)">Previous</button><button class="btn" onclick="goTodayCalendar()">Today</button><button class="btn" onclick="changeMonth(1)">Next</button></div></div><div class="calendar-wrap"><div class="calendar">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="day"><b>${x}</b></div>`).join("")}${cells}</div></div></div>`};window.goTodayCalendar=()=>{state.calendarDate=new Date();renderCalendar()};window.changeMonth=n=>{state.calendarDate=new Date(state.calendarDate.getFullYear(),state.calendarDate.getMonth()+n,1);renderCalendar()};
function renderFeatured(){$('featured').innerHTML=`<div class="crumb">FEATURED / EDITORIAL</div><div class="panel"><div class="article-body">${state.settings.featured||'<p>No featured content has been published yet.</p>'}</div></div>`}
function renderAbout(){$("about").innerHTML=`<div class="crumb">ABOUT</div><div class="panel"><h2>About</h2><div class="article-body">${state.settings.about||""}</div></div>`}
function renderContact(){$('contact').innerHTML=`<div class="crumb">CONTACT / REFERENCE</div><div class="panel"><div class="article-body">${state.settings.contact||'<p>Contact information has not been published yet.</p>'}</div></div>`}
function renderSearch(){ $("searchPage").innerHTML=`<div class="crumb">SEARCH / PUBLIC RECORDS</div><div class="panel"><div class="search"><input id="globalQ" placeholder="Search articles, files and pages…"></div><div id="globalResults" class="list"></div></div>`;globalQ.oninput=()=>{let q=globalQ.value.toLowerCase();let a=state.articles.filter(x=>x.public&&(x.title+" "+x.summary).toLowerCase().includes(q)).map(x=>`<div class="row"><span><b>${esc(x.title)}</b><div class="meta">ARTICLE</div></span><button class="btn" data-sr="${x.id}">Open</button></div>`);let f=state.files.filter(x=>x.public&&(x.title+" "+(x.description||"")).toLowerCase().includes(q)).map(x=>`<div class="row"><span><b>${esc(x.title)}</b><div class="meta">${esc(x.type)}</div></span><button class="btn" data-sf="${x.id}">Preview</button></div>`);let p=state.pages.filter(x=>x.public&&(x.title+" ").toLowerCase().includes(q)).map(x=>`<div class="row"><span><b>${esc(x.title)}</b><div class="meta">PAGE</div></span><button class="btn" onclick="go('page:${esc(x.slug)}')">Open</button></div>`);globalResults.innerHTML=[...a,...f,...p].join("")||"<p>No results.</p>";document.querySelectorAll("[data-sr]").forEach(b=>b.onclick=()=>openArticle(b.dataset.sr));document.querySelectorAll("[data-sf]").forEach(b=>b.onclick=()=>previewFile(b.dataset.sf))};globalQ.oninput()}

function cleanHTML(html=""){let t=document.createElement("template");t.innerHTML=String(html);let allowed=new Set(["B","STRONG","I","EM","U","UL","OL","LI","H2","H3","P","BR","BLOCKQUOTE","A","DIV","SPAN"]);t.content.querySelectorAll("*").forEach(el=>{if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);return}for(let a of [...el.attributes]){let ok=el.tagName==="A"&&["href","target","rel","class"].includes(a.name);if(!ok)el.removeAttribute(a.name)}if(el.tagName==="A"){let href=el.getAttribute("href")||"";if(!/^(https?:|mailto:|#)/i.test(href))el.removeAttribute("href");el.setAttribute("rel","noopener noreferrer")}});return t.innerHTML}
function toolbar(){return `<div class="editor-toolbar"><button type="button" onclick="fmtCmd('bold')"><b>B</b></button><button type="button" onclick="fmtCmd('italic')"><i>I</i></button><button type="button" onclick="fmtCmd('underline')"><u>U</u></button><button type="button" onclick="fmtCmd('insertUnorderedList')">List</button><button type="button" onclick="fmtCmd('formatBlock','h2')">H2</button><button type="button" onclick="fmtCmd('formatBlock','blockquote')">Quote</button><button type="button" onclick="insertLink()">Link</button><button type="button" onclick="insertInternalLink()">Article/Page link</button><button type="button" onclick="insertButton()">Button</button><button type="button" onclick="fmtCmd('removeFormat')">Clear</button></div>`};window.fmtCmd=(c,v)=>document.execCommand(c,false,v);window.insertLink=()=>{let u=prompt("URL (https://…)");if(u)document.execCommand("createLink",false,u)};window.insertInternalLink=()=>{let opts=[...state.articles.filter(a=>a.public).map(a=>({text:a.title,url:`#article/${a.id}`})),...state.pages.filter(p=>p.public).map(p=>({text:p.title,url:`#page/${p.slug}`})),{text:"About",url:"#about"},{text:"Contact",url:"#contact"}];let text=prompt("Link text",opts[0]?.text||"Link");if(!text)return;let url=prompt("Target: #article/ID, #page/slug, #about, #contact, or external URL",opts[0]?.url||"#about");if(!url)return;document.execCommand("insertHTML",false,`<a href="${esc(url)}">${esc(text)}</a>`)};window.insertButton=()=>{let text=prompt("Button text","Open");if(!text)return;let url=prompt("Button URL","#about");if(!url)return;document.execCommand("insertHTML",false,`<a class="btn" href="${esc(url)}">${esc(text)}</a>`)};
function richField(id,value=""){return `${toolbar()}<div id="${id}" class="editor" contenteditable="true">${value}</div>`}

window.togglePass=(id,b)=>{let x=$(id),visible=x.type==="password";x.type=visible?"text":"password";b.classList.toggle("is-visible",visible);b.setAttribute("aria-label",visible?"Hide password":"Show password");b.title=visible?"Hide password":"Show password"};
function adminHTML(){if(!state.admin)return state.ready?adminLogin():adminSetup();return `<div class="admin-head"><div><div class="eyebrow">Administration</div><h2 style="margin:5px 0">Archive control desk</h2></div><div class="actions"><button class="btn" onclick="go('home')">View site</button><button class="btn" onclick="logoutAdmin()">Log out</button></div></div><div class="admin-layout"><aside class="admin-menu"><button class="active" data-as="overview">Overview</button><button data-as="articles">Articles</button><button data-as="featured">Featured</button><button data-as="archive">Archive files</button><button data-as="calendar">Calendar</button><button data-as="pages">Pages</button><button data-as="navigation">Navigation & links</button><button data-as="site">Site content</button><button data-as="account">Account</button></aside><div><div id="as-overview" class="admin-section active">${adminOverview()}</div><div id="as-articles" class="admin-section">${adminArticles()}</div><div id="as-featured" class="admin-section">${adminFeatured()}</div><div id="as-archive" class="admin-section">${adminFiles()}</div><div id="as-calendar" class="admin-section">${adminEvents()}</div><div id="as-pages" class="admin-section">${adminPages()}</div><div id="as-navigation" class="admin-section">${adminNavLinks()}</div><div id="as-site" class="admin-section">${adminSite()}</div><div id="as-account" class="admin-section">${adminAccount()}</div></div></div>`}

function adminFeatured(){return `<div class="panel"><div class="admin-head"><div><h3>Featured page</h3><p class="toolbar-note">This is the standalone Featured page shown in the main navigation.</p></div></div>${richField('featuredBody',state.settings.featured||'')}<br><button class="btn primary" onclick="saveFeatured()">Save featured page</button></div>`}
function adminArticles(){let editing=state.editingArticle||null;return `<div class="panel"><div class="admin-head"><div><h3>Article management</h3><p class="toolbar-note">Write and edit articles directly in the dashboard. The editor is a full dashboard section, not a popup.</p></div><button class="btn primary" onclick="startArticleEditor()">New article</button></div><div class="list">${state.articles.map(a=>`<div class="row"><span><b>${esc(a.title)}</b><div class="meta">${a.public?'PUBLIC':'PRIVATE'} • ${esc(a.date||fmt(a.createdAt))}</div></span><div class="actions"><button class="btn small" onclick="startArticleEditor('${a.id}')">Edit</button><button class="btn small" onclick="togglePublic('articles','${a.id}',${!a.public})">${a.public?'Make private':'Make public'}</button><button class="btn small danger" onclick="deleteArticle('${a.id}')">Delete</button></div></div>`).join("")||"<p>No articles.</p>"}</div></div>${editing?articleEditor(editing):""}`}
function articleEditor(a={}){return `<div class="panel" id="articleEditorPanel" style="margin-top:12px"><div class="admin-head"><div><div class="eyebrow">${a.id?'Edit article':'New article'}</div><h3>${a.id?esc(a.title):'Create article'}</h3></div><button class="btn small" onclick="cancelArticleEditor()">Close editor</button></div><div class="article-editor"><div><div class="field"><label>Title</label><input id="mTitle" value="${esc(a.title||'')}"></div><div class="field"><label>Subtitle</label><input id="mSubtitle" value="${esc(a.subtitle||'')}"></div><div class="field"><label>Summary</label><textarea id="mSummary">${esc(a.summary||'')}</textarea></div><div class="two"><div class="field"><label>Date</label><input id="mDate" type="date" value="${esc(a.date||today())}"></div><div class="field"><label>Category</label><input id="mCategory" value="${esc(a.category||'Article')}"></div></div><div class="field"><label>Visibility</label><select id="mPublic"><option value="true" ${a.public!==false?'selected':''}>Public</option><option value="false" ${a.public===false?'selected':''}>Private</option></select></div><label class="toolbar-note"><input id="mFeatured" type="checkbox" ${a.featured?'checked':''}> Featured article</label></div><div><div class="field"><label>Article content</label>${richField('mBody',a.body||'')}</div><div class="actions"><button class="btn primary" onclick="saveArticle('${a.id||''}')">Save article</button><button class="btn" onclick="cancelArticleEditor()">Cancel</button></div><div id="articleSaveStatus" class="editor-status"></div></div></div></div>`}

function siteURL(){return location.href.split("#")[0]}
function adminAccount(){return `<div class="panel"><h3>Administrator account</h3><div class="field"><label>Current username</label><input id="curUser" value="${esc(state.admin.username)}"></div><button class="btn" onclick="changeUsername()">Change username</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Change password</h3><div class="field pw"><label>Current password</label><input id="oldPass" type="password"><button type="button" aria-label="Show password" title="Show password" onclick="togglePass('oldPass',this)"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 18 18"/><path d="M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.2 3.7M6.5 6.8C3.7 8.4 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 3-.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div><div class="field pw"><label>New password (minimum 6 characters)</label><input id="newPass" type="password"><button type="button" aria-label="Show password" title="Show password" onclick="togglePass('newPass',this)"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 18 18"/><path d="M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.2 3.7M6.5 6.8C3.7 8.4 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 3-.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div><div class="field pw"><label>Confirm new password</label><input id="newPass2" type="password"><button type="button" aria-label="Show password" title="Show password" onclick="togglePass('newPass2',this)"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 18 18"/><path d="M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.2 3.7M6.5 6.8C3.7 8.4 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 3-.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div><button class="btn primary" onclick="changePassword()">Change password</button></div>`}
function adminTab(id){document.querySelectorAll('.admin-section').forEach(x=>x.classList.remove('active'));$('as-'+id).classList.add('active');document.querySelectorAll('.admin-menu button').forEach(b=>b.classList.toggle('active',b.dataset.as===id))};window.adminTab=adminTab;
function bindAdmin(){document.querySelectorAll(".admin-menu button").forEach(b=>b.onclick=()=>adminTab(b.dataset.as))}
window.deleteArticle=async id=>{if(!confirm('Delete this article permanently?'))return;await deleteDoc(doc(db,'articles',id));state.editingArticle=null;await loadAll();adminTab('articles');toast('Article deleted.')};window.togglePublic=async(col,id,val)=>{await updateDoc(doc(db,col,id),{public:val,updatedAt:serverTimestamp()});toast(val?'Published.':'Made private.')};
function fileForm(f={}){return `<div class="modal-head"><h2>${f.id?'Edit archive record':'Upload archive file'}</h2><button class="btn small" onclick="closeModal()">Close</button></div>${f.id?'':'<div class="file-drop"><input id="fUpload" type="file"><div class="toolbar-note">Choose an image, PDF, video, audio or text file. The file is committed to the configured GitHub repository.</div></div>'}<div class="field"><label>Title</label><input id="fTitle" value="${esc(f.title||'')}"></div><div class="field"><label>Description</label><textarea id="fDesc">${esc(f.description||'')}</textarea></div><div class="two"><div class="field"><label>Type</label><select id="fType">${['image','pdf','video','audio','text','other'].map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Visibility</label><select id="fPublic"><option value="true" ${f.public!==false?'selected':''}>Public</option><option value="false" ${f.public===false?'selected':''}>Private</option></select></div></div><div class="two"><label class="toolbar-note"><input id="fDownload" type="checkbox" ${f.downloadable?'checked':''}> Allow download</label><label class="toolbar-note"><input id="fFeatured" type="checkbox" ${f.featured?'checked':''}> Featured archive file</label></div><div id="fileUploadStatus" class="editor-status"></div><div id="fileProgress" class="upload-progress hidden"><span></span></div><br><button class="btn primary" onclick="saveFile('${f.id||''}')">${f.id?'Save record':'Upload file'}</button>`}
window.newFile=()=>showModal(fileForm());window.editFile=id=>{let f=state.files.find(x=>x.id===id);if(f)showModal(fileForm(f))};
function githubConfigFromUI(){return {owner:$('ghOwner')?.value.trim()||'',repo:$('ghRepo')?.value.trim()||'',branch:$('ghBranch')?.value.trim()||'main',token:$('ghToken')?.value.trim()||''}}
function githubHeaders(){return {Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10',Authorization:`Bearer ${state.github.token}`,'Content-Type':'application/json'}}
async function githubApi(path,options={}){if(!state.github.owner||!state.github.repo||!state.github.token)throw new Error('Connect a GitHub repository and token first.');let r=await fetch(`https://api.github.com${path}`,{...options,headers:{...githubHeaders(),...(options.headers||{})}});let text=await r.text(),data={};try{data=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(data.message||`GitHub API error (${r.status})`);return data}
window.saveGithubConfig=async function(){state.github=githubConfigFromUI();let st=$('githubStatus');if(!state.github.owner||!state.github.repo||!state.github.token){if(st)st.textContent='Account username, repository name and token are required.';return}try{await updateDoc(doc(db,'admins',auth.currentUser.uid),{github:{owner:state.github.owner,repo:state.github.repo,branch:state.github.branch||'main',token:state.github.token},updatedAt:serverTimestamp()});if(st)st.textContent='Repository connection saved.';toast('Repository connection saved.');renderAdminOnly();adminTab('archive')}catch(e){if(st)st.textContent='Could not save connection: '+e.message}}
function clearGithubToken(){state.github.token='';let st=$('githubStatus');if(st)st.textContent='Token cleared from memory.';renderAdminOnly();adminTab('archive')}
window.testGithubConnection=async function(){try{state.github=githubConfigFromUI();let r=await githubApi(`/repos/${encodeURIComponent(state.github.owner)}/${encodeURIComponent(state.github.repo)}`);let st=$('githubStatus');if(st)st.textContent=`Connected to ${r.full_name}.`;toast('GitHub connection works.')}catch(e){let st=$('githubStatus');if(st)st.textContent='Connection failed: '+e.message}}
function bytesToBase64(buffer){let bytes=new Uint8Array(buffer),chunk=0x8000,out='';for(let i=0;i<bytes.length;i+=chunk)out+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(out)}
function githubRawUrl(path){return `https://raw.githubusercontent.com/${encodeURIComponent(state.github.owner)}/${encodeURIComponent(state.github.repo)}/${encodeURIComponent(state.github.branch||'main')}/${path.split('/').map(encodeURIComponent).join('/')}`}
async function githubPutFile(path,content,message,sha=''){let body={message,content,branch:state.github.branch||'main'};if(sha)body.sha=sha;return githubApi(`/repos/${encodeURIComponent(state.github.owner)}/${encodeURIComponent(state.github.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'PUT',body:JSON.stringify(body)})}
async function githubDeleteFile(path,sha,message){return githubApi(`/repos/${encodeURIComponent(state.github.owner)}/${encodeURIComponent(state.github.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'DELETE',body:JSON.stringify({message,sha,branch:state.github.branch||'main'})})}
window.saveFile=async id=>{let old=id?state.files.find(x=>x.id===id):null,status=$('fileUploadStatus'),prog=$('fileProgress'),bar=prog?.querySelector('span');try{if(!state.github.token)throw new Error('Connect GitHub in Archive file management before uploading.');let file=$('fUpload')?.files?.[0];if(!id&&!file)return alert('Choose a file first.');if(id){let data={title:$('fTitle').value.trim()||old?.title||'Untitled file',description:$('fDesc').value,type:$('fType').value,public:$('fPublic').value==='true',downloadable:$('fDownload').checked,featured:$('fFeatured').checked,updatedAt:serverTimestamp()};await updateDoc(doc(db,'files',id),data);closeModal();await loadAll();toast('Archive record saved.');return}if(status)status.textContent='Preparing upload…';prog?.classList.remove('hidden');if(bar)bar.style.width='15%';let safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`archive/${Date.now()}_${safeName}`,base64=bytesToBase64(await file.arrayBuffer());if(bar)bar.style.width='45%';if(status)status.textContent='Uploading to GitHub…';let result=await githubPutFile(path,base64,`Add archive file: ${file.name}`);if(bar)bar.style.width='85%';let isPublic=$('fPublic').value==='true';let data={title:$('fTitle').value.trim()||file.name,description:$('fDesc').value,type:$('fType').value,public:isPublic,downloadable:$('fDownload').checked,featured:$('fFeatured').checked,name:file.name,path,githubPath:path,githubSha:result.content?.sha||'',url:isPublic?githubRawUrl(path):'',size:file.size,mimeType:file.type,createdAt:serverTimestamp(),updatedAt:serverTimestamp()};await addDoc(collection(db,'files'),data);if(bar)bar.style.width='100%';closeModal();await loadAll();toast('File uploaded to GitHub archive.')}catch(e){console.error(e);if(status)status.textContent='Upload failed: '+e.message;else alert('Upload failed: '+e.message)}};
window.deleteFile=async id=>{let f=state.files.find(x=>x.id===id);if(!f||!confirm('Delete this archive file and its GitHub copy?'))return;try{if(f.githubPath&&f.githubSha){await githubDeleteFile(f.githubPath,f.githubSha,`Delete archive file: ${f.name||f.title||id}`)}await deleteDoc(doc(db,'files',id));toast('Archive file deleted.');await loadAll()}catch(e){alert('Could not delete file: '+e.message)}};

function eventForm(e={}){return `<div class="modal-head"><h2>${e.id?'Edit event':'New event'}</h2><button class="btn small" onclick="closeModal()">Close</button></div><div class="field"><label>Event title</label><input id="eTitle" value="${esc(e.title||'')}"></div><div class="two"><div class="field"><label>Date</label><input id="eDate" type="date" value="${esc(e.date||today())}"></div><div class="field"><label>Visibility</label><select id="ePublic"><option value="true" ${e.public!==false?'selected':''}>Public</option><option value="false" ${e.public===false?'selected':''}>Private</option></select></div></div><div class="field"><label>Notes</label><textarea id="eNotes">${esc(e.notes||'')}</textarea></div><button class="btn primary" onclick="saveEvent('${e.id||''}')">Save event</button>`}window.newEvent=()=>showModal(eventForm());window.editEvent=id=>{let e=state.events.find(x=>x.id===id);if(e)showModal(eventForm(e))};window.saveEvent=async id=>{let data={title:eTitle.value.trim()||'Untitled event',date:eDate.value,public:ePublic.value==='true',notes:eNotes.value,updatedAt:serverTimestamp()};if(id)await updateDoc(doc(db,'events',id),data);else await addDoc(collection(db,'events'),{...data,createdAt:serverTimestamp()});closeModal();toast('Event saved.')};window.deleteEvent=async id=>{if(confirm('Delete this event?')){await deleteDoc(doc(db,'events',id));toast('Event deleted.')}};
function pageForm(p={}){return `<div class="modal-head"><h2>${p.id?'Edit page':'New custom page'}</h2><button class="btn small" onclick="closeModal()">Close</button></div><div class="field"><label>Page title</label><input id="pTitle" value="${esc(p.title||'')}"></div><div class="field"><label>URL slug</label><input id="pSlug" value="${esc(p.slug||'')}" placeholder="example-page"></div><div class="two"><div class="field"><label>Visibility</label><select id="pPublic"><option value="true" ${p.public!==false?'selected':''}>Public</option><option value="false" ${p.public===false?'selected':''}>Private</option></select></div><div class="field"><label>Navigation</label><select id="pNav"><option value="true" ${p.nav!==false?'selected':''}>Show in navigation</option><option value="false" ${p.nav===false?'selected':''}>Hide from navigation</option></select></div></div><div class="field"><label>Page content</label>${richField('pBody',p.body||'')}</div><button class="btn primary" onclick="savePage('${p.id||''}')">Save page</button>`}window.newPage=()=>showModal(pageForm());window.editPage=id=>{let p=state.pages.find(x=>x.id===id);if(p)showModal(pageForm(p))};window.savePage=async id=>{let slug=slugify(pSlug.value||pTitle.value);let data={title:pTitle.value.trim()||'Untitled page',slug,public:pPublic.value==='true',nav:pNav.value==='true',body:cleanHTML(pBody.innerHTML),updatedAt:serverTimestamp()};if(id)await updateDoc(doc(db,'pages',id),data);else await addDoc(collection(db,'pages'),{...data,createdAt:serverTimestamp()});closeModal();toast('Page saved.')};window.deletePage=async id=>{if(confirm('Delete this page?')){await deleteDoc(doc(db,'pages',id));toast('Page deleted.')}};
function navLinkForm(l={}){return `<div class="modal-head"><h2>${l.id?'Edit navigation link':'New navigation link'}</h2><button class="btn small" onclick="closeModal()">Close</button></div><div class="field"><label>Label</label><input id="lTitle" value="${esc(l.title||'')}"></div><div class="field"><label>URL</label><input id="lUrl" value="${esc(l.url||'')}" placeholder="https://example.com or #about"></div><label class="toolbar-note"><input id="lShow" type="checkbox" ${l.show!==false?'checked':''}> Show in navigation</label><br><br><button class="btn primary" onclick="saveNavLink('${l.id||''}')">Save link</button>`}window.newNavLink=()=>showModal(navLinkForm());window.editNavLink=id=>{let l=state.links.find(x=>x.id===id);if(l)showModal(navLinkForm(l))};window.saveNavLink=async id=>{let data={title:lTitle.value.trim()||'Link',url:lUrl.value.trim()||'#',show:lShow.checked,updatedAt:serverTimestamp()};if(id)await updateDoc(doc(db,'links',id),data);else await addDoc(collection(db,'links'),{...data,createdAt:serverTimestamp()});closeModal();toast('Navigation link saved.')};window.deleteNavLink=async id=>{if(confirm('Delete this link?')){await deleteDoc(doc(db,'links',id));toast('Link deleted.')}};
window.saveFeatured=async()=>{try{let body=cleanHTML($("featuredBody").innerHTML);await setDoc(doc(db,"settings","site"),{featured:body,updatedAt:serverTimestamp()},{merge:true});state.settings.featured=body;render();toast("Featured page saved.");adminTab("featured")}catch(e){alert("Could not save featured page: "+e.message)}};
window.saveSite=async()=>{try{let data={title:$("sTitle").value.trim()||"Personal Archive",subtitle:$("sSubtitle").value,footer:$("sFooter").value,footerRight:$("sFooterRight").value,notice:{show:$("sNoticeShow").checked,text:$("sNotice").value},about:cleanHTML($("sAbout").innerHTML),contact:cleanHTML($("sContact").innerHTML),homeFeatured:{title:$("hTitle")?.value||'Personal digital archive',subtitle:$("hSubtitle")?.value||'A personal archive, organized for the long term.',body:cleanHTML($("hBody")?.innerHTML||'')},updatedAt:serverTimestamp()};await setDoc(doc(db,"settings","site"),data,{merge:true});state.settings={...state.settings,...data,updatedAt:new Date()};render();toast("Site content saved.");adminTab("site")}catch(e){console.error(e);alert("Could not save site content: "+e.message)}};
window.changeUsername=async()=>{let nu=$("curUser").value.trim();if(!nu||nu===state.admin.username)return;try{let newEmail=authEmail(nu);await updateEmail(auth.currentUser,newEmail);await setDoc(doc(db,'admins',auth.currentUser.uid),{username:nu,email:newEmail,updatedAt:serverTimestamp()},{merge:true});state.admin.username=nu;toast('Username changed.')}catch(e){alert(e.message)}};
window.changePassword=async()=>{let old=$("oldPass").value,n1=$("newPass").value,n2=$("newPass2").value;if(n1.length<6||n1!==n2)return alert('New password must be at least 6 characters and match confirmation.');try{let c=EmailAuthProvider.credential(auth.currentUser.email,old);await reauthenticateWithCredential(auth.currentUser,c);await updatePassword(auth.currentUser,n1);toast('Password changed.')}catch(e){alert(e.message)}};
window.setupAdmin=async()=>{let u=$("setupUser").value.trim(),p=$("setupPass").value;if(!u||p.length<6||p!==$("setupPass2").value)return alert('Enter a username and a matching password of at least 6 characters.');try{let existing=await getDoc(doc(db,'system','setup'));if(existing.exists()&&existing.data().initialized)return alert('Administrator is already initialized.');let email=authEmail(u),cred=await createUserWithEmailAndPassword(auth,email,p);await setDoc(doc(db,'admins',cred.user.uid),{username:u,email,role:'admin',createdAt:serverTimestamp()});await setDoc(doc(db,'system','setup'),{initialized:true,adminUid:cred.user.uid,updatedAt:serverTimestamp()},{merge:true});toast('Administrator created.')}catch(e){alert(e.message)}};
window.loginAdmin=async()=>{try{let u=$("loginUser").value.trim(),p=$("loginPass").value;await signInWithEmailAndPassword(auth,authEmail(u),p);toast("Signed in.");location.hash="#admin"}catch(e){alert("Invalid username or password.")}};window.logoutAdmin=async()=>{try{await signOut(auth)}finally{state.admin=null;state.ready=true;go("home");renderNav()}};
async function loadAll(){try{let admin=!!state.admin;let settings=await getDoc(doc(db,'settings','site'));if(settings.exists())state.settings={...state.settings,...settings.data()};if(admin){let gc=await getDoc(doc(db,'admins',auth.currentUser.uid));if(gc.exists()&&gc.data().github)state.github={...state.github,...gc.data().github}}let readCol=async name=>{if(admin)return getDocs(collection(db,name));return getDocs(query(collection(db,name),where('public','==',true)))};let [arts,files,events,pages,links]=await Promise.all([readCol('articles'),readCol('files'),readCol('events'),readCol('pages'),admin?getDocs(collection(db,'links')):getDocs(query(collection(db,'links'),where('show','==',true)))]);state.articles=arts.docs.map(d=>({id:d.id,...d.data()}));state.files=files.docs.map(d=>({id:d.id,...d.data()}));state.events=events.docs.map(d=>({id:d.id,...d.data()}));state.pages=pages.docs.map(d=>({id:d.id,...d.data()}));state.links=links.docs.map(d=>({id:d.id,...d.data()}));state.ready=true;render()}catch(e){console.error(e);$("home").innerHTML=`<div class="panel"><h2>Firebase connection error</h2><p>${esc(e.message)}</p></div>`}}
function render(){document.title=state.settings.title||'Personal Archive';$("siteTitle").textContent=state.settings.title||'Personal Archive';$("siteSubtitle").textContent=state.settings.subtitle||'';$("footerLeft").textContent=state.settings.footer||'';$("footerRight").textContent=state.settings.footerRight||'Archive interface';$("notice").classList.toggle('show',!!state.settings.notice?.show);$("noticeText").textContent=state.settings.notice?.text||'';renderNav();if(state.currentPage==='home')renderHome();else if(state.currentPage==='featured')renderFeatured();else if(state.currentPage==='articles')renderArticles();else if(state.currentPage==='archive')renderArchive();else if(state.currentPage==='calendar')renderCalendar();else if(state.currentPage==='about')renderAbout();else if(state.currentPage==='contact')renderContact();else if(state.currentPage==='searchPage')renderSearch();else if(state.currentPage.startsWith('page:'))renderDynamic();else if(state.currentPage==='admin'){$("admin").innerHTML=state.ready?(state.admin?adminHTML():((state.setupExists===false)?adminSetup():adminLogin())):'<div class="loading">Connecting to Firebase…</div>';if(state.admin)bindAdmin()}}
async function checkAdmin(user){if(!user){state.admin=null;return}let s=await getDoc(doc(db,'admins',user.uid));state.admin=s.exists()?{id:user.uid,...s.data()}:null}
onAuthStateChanged(auth,async user=>{try{await checkAdmin(user);let setup=await getDoc(doc(db,'system','setup'));state.setupExists=setup.exists()&&setup.data().initialized;await loadAll()}catch(e){console.error(e)}});
function resolveHash(){let h=decodeURIComponent(location.hash.slice(1));if(h==='admin'){go('admin');return}if(h.startsWith('article/')){openArticle(h.slice(8));return}if(h.startsWith('page/')){go('page:'+h.slice(5));return}if(['about','contact','articles','archive','calendar','searchPage','home','featured'].includes(h)){go(h);return}if(!h){go('home')}}
// Expose every handler used by inline dashboard/editor buttons. The application is an ES module, so
// normal function declarations are otherwise module-scoped and unavailable to onclick attributes.
Object.assign(window,{
  go,goTodayCalendar,changeMonth,closeModal,
  loginAdmin,setupAdmin,logoutAdmin,togglePass,
  fmtCmd,insertLink,insertInternalLink,insertButton,
  newArticle,startArticleEditor,cancelArticleEditor,saveArticle,deleteArticle,
  newFile,editFile,saveFile,deleteFile,previewFile,
  saveGithubConfig,testGithubConnection,clearGithubToken,
  newEvent,editEvent,saveEvent,deleteEvent,
  newPage,editPage,savePage,deletePage,
  newNavLink,editNavLink,saveNavLink,deleteNavLink,
  saveSite,saveFeatured,changeUsername,changePassword,
  togglePublic,adminTab
});
window.addEventListener('hashchange',resolveHash);
resolveHash();
</script>
</body></html>
