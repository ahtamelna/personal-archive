<style>
:root{--paper:#f1eee5;--paper2:#faf8f1;--white:#fffdf7;--ink:#252a28;--muted:#68706c;--line:#b9b7ad;--accent:#315a52;--accent2:#dfe7e2;--warn:#8a5b2f;--danger:#8a3e36;--shadow:4px 4px 0 rgba(0,0,0,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;background-image:linear-gradient(rgba(0,0,0,.022) 1px,transparent 1px);background-size:100% 5px}a{color:var(--accent)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.site-header{border:1px solid var(--line);background:var(--paper2);box-shadow:var(--shadow);margin-top:14px}.top{display:flex;gap:16px;align-items:center;padding:17px;border-bottom:1px solid var(--line)}.seal{width:58px;height:58px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:700 19px Georgia,serif}.brand h1{font:700 25px Georgia,serif;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.nav{display:flex;flex-wrap:wrap}.nav button{background:none;border:0;border-right:1px solid var(--line);padding:11px 15px;color:var(--ink);text-transform:uppercase;font-size:10px;letter-spacing:.09em}.nav button:hover,.nav button.active{background:#e5e1d6}.notice{display:none;background:#263b36;color:#f4f1e8;padding:8px 12px;overflow:hidden;white-space:nowrap}.notice.show{display:block}.ticker{display:inline-block;animation:ticker 22s linear infinite}.notice:hover .ticker{animation-play-state:paused}@keyframes ticker{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
main{flex:1;padding:22px 0 28px}.page{display:none}.page.active{display:block}.crumb{font-size:10px;color:var(--muted);letter-spacing:.08em;margin-bottom:12px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.panel,.card{border:1px solid var(--line);background:var(--paper2);padding:18px}.panel h2,.panel h3{font-family:Georgia,serif;margin:0 0 12px}.hero{min-height:260px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow,.tag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:bold}.hero h2{font:700 34px Georgia,serif;max-width:780px;margin:10px 0}.card h3{font:700 18px Georgia,serif;margin:7px 0}.card p,.panel p{font-size:12px;line-height:1.6;color:#4f5652}.meta{font-size:10px;color:var(--muted)}.btn{display:inline-block;border:1px solid var(--ink);background:#e8e4d9;padding:9px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);text-decoration:none}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{background:#eee0d8;color:var(--danger);border-color:#b69b95}.btn.small{padding:6px 8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{display:flex;gap:8px;margin-bottom:15px}.search input{flex:1}.field{margin-bottom:12px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-weight:bold}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--white);padding:9px}.field textarea{min-height:110px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:11px 0}.row:first-child{border-top:0}.list{display:grid}.status{font-size:9px;padding:3px 6px;border:1px solid var(--line)}.public{color:var(--accent)}.private{color:var(--warn)}.calendar-wrap{overflow:auto}.calendar{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);min-width:735px}.day{min-height:105px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;background:#fbf9f2}.day.other{background:#efede5;color:#999}.day.today{box-shadow:inset 0 0 0 2px var(--accent)}.day b{font-size:11px}.event{font-size:10px;background:var(--accent2);margin-top:5px;padding:4px}.article-body{line-height:1.85;font-size:14px}.article-body img{max-width:100%;height:auto}.article-body iframe{max-width:100%}.article-body blockquote{border-left:3px solid var(--accent);padding-left:14px;color:var(--muted)}.article-body table{border-collapse:collapse;max-width:100%}.article-body td,.article-body th{border:1px solid var(--line);padding:6px}.editor-toolbar{display:flex;flex-wrap:wrap;gap:5px;padding:7px;border:1px solid var(--line);border-bottom:0;background:#e9e5db}.editor-toolbar button{padding:6px 8px;border:1px solid var(--line);background:var(--white);font-size:10px}.editor{min-height:230px;border:1px solid var(--line);background:#fff;padding:12px;outline:none;line-height:1.7}.editor:focus{box-shadow:inset 0 0 0 2px #d5dfda}.admin-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.admin-layout{display:grid;grid-template-columns:205px 1fr;gap:14px}.admin-menu{border:1px solid var(--line);background:var(--paper2);padding:8px;height:max-content;position:sticky;top:10px}.admin-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px;font-size:10px;text-transform:uppercase;letter-spacing:.07em}.admin-menu button:hover,.admin-menu button.active{background:#e5e1d6}.admin-section{display:none}.admin-section.active{display:block}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{border:1px solid var(--line);padding:12px;background:#f7f4eb}.stat strong{font:700 24px Georgia,serif;display:block}.toolbar-note{font-size:10px;color:var(--muted)}.pw{position:relative}.pw input{padding-right:75px}.pw button{position:absolute;right:5px;top:4px;border:0;background:none;padding:5px;font-size:10px;color:var(--accent)}.modal{position:fixed;inset:0;background:rgba(20,24,22,.55);display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modal-box{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--paper2);border:1px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.18);padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}.toast{position:fixed;right:16px;bottom:16px;background:#263b36;color:#fff;padding:10px 14px;font-size:11px;display:none;z-index:30}.toast.show{display:block}.loading{padding:35px;text-align:center;color:var(--muted)}footer{width:min(1180px,calc(100% - 28px));margin:0 auto;border-top:1px solid var(--line);padding:19px 0;color:var(--muted);font-size:10px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.hidden{display:none!important}
@media(max-width:850px){.grid,.cards,.admin-layout,.two{grid-template-columns:1fr}.admin-menu{position:static}.statgrid{grid-template-columns:1fr 1fr}.hero h2{font-size:28px}}@media(max-width:520px){.shell,footer{width:min(100% - 18px,1180px)}.top{padding:12px}.seal{width:46px;height:46px}.brand h1{font-size:20px}.nav button{padding:10px 11px}.statgrid{grid-template-columns:1fr}.search{flex-direction:column}}

<body>
<div class="app"><div class="shell">
<header class="site-header"><div class="top"><div class="seal">PA</div><div class="brand"><h1 id="siteTitle">Personal Archive</h1><p id="siteSubtitle">A private digital record and public reading room.</p></div></div><div id="notice" class="notice"><span id="noticeText" class="ticker"></span></div><nav id="nav" class="nav"></nav></header>
</div>
<main><div class="shell">
<section id="home" class="page active"></section><section id="articles" class="page"></section><section id="archive" class="page"></section><section id="calendar" class="page"></section><section id="about" class="page"></section><section id="contact" class="page"></section><section id="searchPage" class="page"></section><section id="dynamicPages" class="page"></section><section id="admin" class="page"></section>
</div></main>
<footer><span id="footerLeft">Personal Digital Archive</span><span id="footerRight">Archive interface</span></footer></div>
<div id="modal" class="modal"><div id="modalBox" class="modal-box"></div></div><div id="toast" class="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateEmail,updatePassword,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,getDocs,query,where,orderBy,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAtTqBLIFie2lDy1_94osAXWRCLBUMrFIQ",authDomain:"personalarchive7.firebaseapp.com",projectId:"personalarchive7",storageBucket:"personalarchive7.firebasestorage.app",messagingSenderId:"628166318645",appId:"1:628166318645:web:61b713a512aee20d0c6f7c"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let state={settings:{title:"Personal Archive",subtitle:"A private digital record and public reading room.",about:"",contact:"",footer:"Personal Digital Archive",notice:{show:false,text:""}},articles:[],files:[],events:[],pages:[],links:[],admin:null,ready:false,currentPage:"home",calendarDate:new Date(),unsub:[],github:{owner:"",repo:"",branch:"main",token:""}};
const slugify=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-").slice(0,80);
const authEmail=u=>`${String(u).trim().toLowerCase().replace(/[^a-z0-9._-]/g,"-")}@pa-login.invalid`;
const fmt=d=>d?.toDate?d.toDate().toLocaleDateString():new Date(d||Date.now()).toLocaleDateString();
const toast=m=>{toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2600)};
const toastEl=$("toast");
function setLoading(id){$(id).innerHTML='<div class="loading">Loading archive records…</div>'}
function showModal(html){$("modalBox").innerHTML=html;$("modal").classList.add("show")};function closeModal(){$("modal").classList.remove("show")};window.closeModal=closeModal;
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function activePublicPages(){return state.pages.filter(p=>p.public)}
function renderNav(){let items=[["home","Home"],["articles","Articles"],["archive","Archive"],["calendar","Calendar"],["about","About"],["contact","Contact"]];items.push(...activePublicPages().filter(p=>p.nav!==false).map(p=>[`page:${p.slug}`,p.title]));items.push(...state.links.filter(l=>l.show!==false).map(l=>[`link:${l.id}`,l.title]));items.push(["searchPage","Search"]);$("nav").innerHTML=items.map(([id,t])=>`<button class="${state.currentPage===id?'active':''}" data-nav="${esc(id)}">${esc(t)}</button>`).join("");document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{let id=b.dataset.nav;if(id.startsWith("link:")){let l=state.links.find(x=>x.id===id.slice(5));if(l)window.open(l.url,"_blank","noopener");return}go(id)});}
function go(id){state.currentPage=id;document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));let target=id.startsWith("page:")?"dynamicPages":id;$(target).classList.add("active");render();scrollTo({top:0,behavior:"smooth"})};window.go=go;
function articleCard(a){return `<article class="card"><span class="tag">${esc(a.category||"article")}</span><h3>${esc(a.title)}</h3><p>${esc(a.summary||"")}</p><div class="meta">${esc(a.date||fmt(a.createdAt))}</div><br><button class="btn" data-read="${a.id}">Read more</button></article>`}
function renderHome(){let featured=state.articles.find(a=>a.public&&a.featured)||state.articles.find(a=>a.public);$("home").innerHTML=`<div class="crumb">PUBLIC READING ROOM / INDEX</div><div class="grid"><div class="panel hero"><div>${featured?`<div class="eyebrow">Featured article</div><h2>${esc(featured.title)}</h2><p>${esc(featured.summary||"")}</p>`:`<div class="eyebrow">Personal digital archive</div><h2>A personal archive, organized for the long term.</h2><p>Articles, documents, media and records in one searchable place.</p>`}</div><div class="actions"><button class="btn primary" onclick="go('articles')">Browse articles</button><button class="btn" onclick="go('archive')">Browse archive</button></div></div><div class="panel"><h3>Archive status</h3><div class="row"><span>Public articles</span><b>${state.articles.filter(a=>a.public).length}</b></div><div class="row"><span>Public files</span><b>${state.files.filter(f=>f.public).length}</b></div><div class="row"><span>Upcoming events</span><b>${state.events.filter(e=>e.public&&e.date>=today()).length}</b></div></div></div><div class="panel" style="margin-top:16px"><h3>Latest articles</h3><div class="cards">${state.articles.filter(a=>a.public).slice(0,6).map(articleCard).join("")||"<p>No public articles yet.</p>"}</div></div>`;bindReads()}
function today(){return new Date().toISOString().slice(0,10)}
function renderArticles(){let arr=state.articles.filter(a=>a.public);$("articles").innerHTML=`<div class="crumb">ARTICLES / PUBLICATIONS</div><div class="panel"><h2>Articles</h2><p>Only summaries are shown here. Open a record to read the complete article.</p><div class="cards">${arr.map(articleCard).join("")||"<p>No public articles yet.</p>"}</div></div>`;bindReads()}
function bindReads(){document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>openArticle(b.dataset.read))}
function openArticle(id){let a=state.articles.find(x=>x.id===id);if(!a||!a.public)return;state.currentPage="article:"+id;document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$("home").classList.add("active");$("home").innerHTML=`<div class="crumb">ARTICLES / RECORD</div><article class="panel"><div class="eyebrow">${esc(a.category||"Article")} • ${esc(a.date||fmt(a.createdAt))}</div><h2 style="font:700 36px Georgia,serif">${esc(a.title)}</h2>${a.subtitle?`<p><strong>${esc(a.subtitle)}</strong></p>`:""}<hr style="border:0;border-top:1px solid var(--line)"><div class="article-body">${a.body||""}</div><br><button class="btn" onclick="go('articles')">Back to articles</button></article>`;renderNav()}
async function renderArchive(){let arr=state.files.filter(f=>f.public);$("archive").innerHTML=`<div class="crumb">ARCHIVE / CATALOGUE</div><div class="panel"><div class="search"><input id="archiveQ" placeholder="Search the catalogue…"><select id="typeQ"><option value="">All types</option><option>image</option><option>pdf</option><option>video</option><option>audio</option><option>text</option><option>other</option></select></div><div id="archiveList" class="list"></div></div>`;let draw=()=>{let q=(archiveQ.value||"").toLowerCase(),t=typeQ.value;let out=arr.filter(x=>(!q||(x.title+" "+(x.description||"")+" "+(x.name||"")).toLowerCase().includes(q))&&(!t||x.type===t)).map(x=>`<div class="row"><span><b>${esc(x.title)}</b><div class="meta">${esc(x.type)} • ${esc(x.name||"")}</div></span><button class="btn" data-preview="${x.id}">Preview</button></div>`).join("")||"<p>No matching public records.</p>";archiveList.innerHTML=out;document.querySelectorAll("[data-preview]").forEach(b=>b.onclick=()=>previewFile(b.dataset.preview))};archiveQ.oninput=draw;typeQ.onchange=draw;draw()}
function previewFile(id){let f=state.files.find(x=>x.id===id);if(!f)return;let media="";if(f.url){if(f.type==="image")media=`<img src="${esc(f.url)}" style="max-width:100%;max-height:650px">`;else if(f.type==="video")media=`<video src="${esc(f.url)}" controls style="max-width:100%;width:100%"></video>`;else if(f.type==="audio")media=`<audio src="${esc(f.url)}" controls style="width:100%"></audio>`;else if(f.type==="pdf")media=`<iframe src="${esc(f.url)}" style="width:100%;height:650px;border:1px solid var(--line)"></iframe>`;else if(f.type==="text")media=`<iframe src="${esc(f.url)}" style="width:100%;height:500px;border:1px solid var(--line)"></iframe>`}showModal(`<div class="modal-head"><div><div class="eyebrow">${esc(f.type)}</div><h2>${esc(f.title)}</h2></div><button class="btn small" onclick="closeModal()">Close</button></div><p>${esc(f.description||"")}</p>${media||"<p>No browser preview is available for this record.</p>"}${f.downloadable&&f.url?`<br><a class="btn" href="${esc(f.url)}" target="_blank" rel="noopener" download>Download</a>`:""}`)}
function renderCalendar(){let d=state.calendarDate,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells="";for(let i=0;i<first;i++)cells+=`<div class="day other"></div>`;for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,ev=state.events.filter(e=>e.public&&e.date===ds);cells+=`<div class="day ${ds===today()?"today":""}"><b>${n}</b>${ev.map(e=>`<div class="event">${esc(e.title)}</div>`).join("")}</div>`}$("calendar").innerHTML=`<div class="crumb">CALENDAR / PUBLIC EVENTS</div><div class="panel"><div class="admin-head"><div><h2>${d.toLocaleString(undefined,{month:"long",year:"numeric"})}</h2><div class="toolbar-note">Public events only</div></div><div class="actions"><button class="btn" onclick="changeMonth(-1)">Previous</button><button class="btn" onclick="state.calendarDate=new Date();renderCalendar()">Today</button><button class="btn" onclick="changeMonth(1)">Next</button></div></div><div class="calendar-wrap"><div class="calendar">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="day"><b>${x}</b></div>`).join("")}${cells}</div></div></div>`};window.changeMonth=n=>{state.calendarDate=new Date(state.calendarDate.getFullYear(),state.calendarDate.getMonth()+n,1);renderCalendar()};
function renderAbout(){$("about").innerHTML=`<div class="crumb">ABOUT</div><div class="panel"><h2>About</h2><div class="article-body">${state.settings.about||""}</div></div>`}
function renderContact(){ $("contact").innerHTML=`<div class="crumb">CONTACT</div><div class="panel"><h2>Contact</h2><div class="article-body">${state.settings.contact||""}</div></div>` }
function renderDynamic(){let slug=state.currentPage.slice(5),p=state.pages.find(x=>x.slug===slug&&x.public);$("dynamicPages").innerHTML=p?`<div class="crumb">PAGE / ${esc(p.title)}</div><article class="panel"><h2>${esc(p.title)}</h2><div class="article-body">${p.body||""}</div></article>`:`<div class="panel"><h2>Page not found</h2></div>`}
function renderSearch(){ $("searchPage").innerHTML=`<div class="crumb">SEARCH / PUBLIC RECORDS</div><div class="panel"><div class="search"><input id="globalQ" placeholder="Search articles, files and pages…"></div><div id="globalResults" class="list"></div></div>`;globalQ.oninput=()=>{let q=globalQ.value.toLowerCase();let a=state.articles.filter(x=>x.public&&(x.title+" "+x.summary).toLowerCase().includes(q)).map(x=>`<div class="row"><span><b>${esc(x.title)}</b><div class="meta">ARTICLE</div></span><button class="btn" data-sr="${x.id}">Open</button></div>`);let f=state.files.filter(x=>x.public&&(x.title+" "+(x.description||"")).toLowerCase().includes(q)).map(x=>`<div class="row"><span><b>${esc(x.title)}</b><div class="meta">${esc(x.type)}</div></span><button class="btn" data-sf="${x.id}">Preview</button></div>`);let p=state.pages.filter(x=>x.public&&(x.title+" ").toLowerCase().includes(q)).map(x=>`<div class="row"><span><b>${esc(x.title)}</b><div class="meta">PAGE</div></span><button class="btn" onclick="go('page:${esc(x.slug)}')">Open</button></div>`);globalResults.innerHTML=[...a,...f,...p].join("")||"<p>No results.</p>";document.querySelectorAll("[data-sr]").forEach(b=>b.onclick=()=>openArticle(b.dataset.sr));document.querySelectorAll("[data-sf]").forEach(b=>b.onclick=()=>previewFile(b.dataset.sf))};globalQ.oninput()}

function toolbar(){return `<div class="editor-toolbar"><button type="button" onclick="fmtCmd('bold')"><b>B</b></button><button type="button" onclick="fmtCmd('italic')"><i>I</i></button><button type="button" onclick="fmtCmd('underline')"><u>U</u></button><button type="button" onclick="fmtCmd('insertUnorderedList')">List</button><button type="button" onclick="fmtCmd('formatBlock','h2')">H2</button><button type="button" onclick="fmtCmd('formatBlock','blockquote')">Quote</button><button type="button" onclick="insertLink()">Link</button><button type="button" onclick="insertInternalLink()">Article/Page link</button><button type="button" onclick="insertButton()">Button</button><button type="button" onclick="fmtCmd('removeFormat')">Clear</button></div>`};window.fmtCmd=(c,v)=>document.execCommand(c,false,v);window.insertLink=()=>{let u=prompt("URL (https://…)");if(u)document.execCommand("createLink",false,u)};window.insertInternalLink=()=>{let opts=[...state.articles.filter(a=>a.public).map(a=>({text:a.title,url:`#article/${a.id}`})),...state.pages.filter(p=>p.public).map(p=>({text:p.title,url:`#page/${p.slug}`})),{text:"About",url:"#about"},{text:"Contact",url:"#contact"}];let text=prompt("Link text",opts[0]?.text||"Link");if(!text)return;let url=prompt("Target: #article/ID, #page/slug, #about, #contact, or external URL",opts[0]?.url||"#about");if(!url)return;document.execCommand("insertHTML",false,`<a href="${esc(url)}">${esc(text)}</a>`)};window.insertButton=()=>{let text=prompt("Button text","Open");if(!text)return;let url=prompt("Button URL","#about");if(!url)return;document.execCommand("insertHTML",false,`<a class="btn" href="${esc(url)}">${esc(text)}</a>`)};
function richField(id,value=""){return `${toolbar()}<div id="${id}" class="editor" contenteditable="true">${value}</div>`}
function adminLogin(){return `<div class="panel" style="max-width:520px;margin:auto"><div class="eyebrow">Administrator access</div><h2>Sign in</h2><div class="field"><label>Username</label><input id="loginUser" autocomplete="username"></div><div class="field pw"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"><button type="button" onclick="togglePass('loginPass',this)">Show</button></div><button class="btn primary" onclick="loginAdmin()">Sign in</button></div>`}
function adminSetup(){return `<div class="panel" style="max-width:520px;margin:auto"><div class="eyebrow">Administrator initialization</div><h2>Create administrator</h2><p class="toolbar-note">The account is stored in Firebase Authentication; content is stored in Firestore and files in GitHub storage.</p><div class="field"><label>Username</label><input id="setupUser" autocomplete="username"></div><div class="field pw"><label>Password (minimum 6 characters)</label><input id="setupPass" type="password" autocomplete="new-password"><button type="button" onclick="togglePass('setupPass',this)">Show</button></div><div class="field pw"><label>Confirm password</label><input id="setupPass2" type="password" autocomplete="new-password"><button type="button" onclick="togglePass('setupPass2',this)">Show</button></div><button class="btn primary" onclick="setupAdmin()">Initialize administrator</button></div>`}
window.togglePass=(id,b)=>{let x=$(id);x.type=x.type==="password"?"text":"password";b.textContent=x.type==="password"?"Show":"Hide"};
function adminHTML(){if(!state.admin)return state.ready?adminLogin():adminSetup();return `<div class="admin-head"><div><div class="eyebrow">Administration</div><h2 style="margin:5px 0">Archive control desk</h2></div><button class="btn" onclick="logoutAdmin()">Log out</button></div><div class="admin-layout"><aside class="admin-menu"><button class="active" data-as="overview">Overview</button><button data-as="articles">Articles</button><button data-as="archive">Archive files</button><button data-as="calendar">Calendar</button><button data-as="pages">Pages</button><button data-as="navigation">Navigation & links</button><button data-as="site">Site content</button><button data-as="account">Account</button></aside><div><div id="as-overview" class="admin-section active">${adminOverview()}</div><div id="as-articles" class="admin-section">${adminArticles()}</div><div id="as-archive" class="admin-section">${adminFiles()}</div><div id="as-calendar" class="admin-section">${adminEvents()}</div><div id="as-pages" class="admin-section">${adminPages()}</div><div id="as-navigation" class="admin-section">${adminNavLinks()}</div><div id="as-site" class="admin-section">${adminSite()}</div><div id="as-account" class="admin-section">${adminAccount()}</div></div></div>`}
function adminOverview(){return `<div class="panel"><h3>System overview</h3><div class="statgrid"><div class="stat"><span>Articles</span><strong>${state.articles.length}</strong></div><div class="stat"><span>Archive files</span><strong>${state.files.length}</strong></div><div class="stat"><span>Events</span><strong>${state.events.length}</strong></div><div class="stat"><span>Pages</span><strong>${state.pages.length}</strong></div></div></div><div class="panel" style="margin-top:12px"><h3>Quick actions</h3><div class="actions"><button class="btn primary" onclick="adminTab('articles');newArticle()">New article</button><button class="btn" onclick="adminTab('archive')">Manage files</button><button class="btn" onclick="adminTab('pages');newPage()">New page</button></div></div>`}
function adminArticles(){return `<div class="panel"><div class="admin-head"><h3>Article management</h3><button class="btn primary" onclick="newArticle()">New article</button></div><div class="list">${state.articles.map(a=>`<div class="row"><span><b>${esc(a.title)}</b><div class="meta">${a.public?'PUBLIC':'PRIVATE'} • ${esc(a.date||fmt(a.createdAt))}</div></span><div class="actions"><button class="btn small" onclick="editArticle('${a.id}')">Edit</button><button class="btn small" onclick="togglePublic('articles','${a.id}',${!a.public})">${a.public?'Make private':'Make public'}</button><button class="btn small danger" onclick="deleteArticle('${a.id}')">Delete</button></div></div>`).join("")||"<p>No articles.</p>"}</div></div>`}
function adminFiles(){return `<div class="panel"><div class="admin-head"><h3>Archive file management</h3><button class="btn primary" onclick="newFile()">Add file</button></div><p class="toolbar-note">Files are stored directly in a GitHub repository through the GitHub REST API. The access token is kept only in memory in this browser tab and is never saved to Firestore or the source code.</p><div class="panel-lite" style="margin:12px 0"><h4>GitHub storage connection</h4><div class="two"><div class="field"><label>Repository owner</label><input id="ghOwner" value="${esc(state.github.owner)}" placeholder="your-github-username"></div><div class="field"><label>Repository name</label><input id="ghRepo" value="${esc(state.github.repo)}" placeholder="personal-archive"></div></div><div class="two"><div class="field"><label>Branch</label><input id="ghBranch" value="${esc(state.github.branch||'main')}" placeholder="main"></div><div class="field"><label>Fine-grained GitHub token</label><input id="ghToken" type="password" value="${esc(state.github.token)}" autocomplete="off" placeholder="github_pat_…"></div></div><div class="actions"><button class="btn" onclick="saveGithubConfig()">Use this repository</button><button class="btn" onclick="clearGithubToken()">Clear token</button></div><p class="toolbar-note">The token needs repository Contents: write permission. Never paste it into your HTML, Firestore, GitHub Pages files, or screenshots.</p><div id="ghStatus" class="meta">${state.github.owner&&state.github.repo&&state.github.token?'GitHub storage configured for this tab.':'GitHub storage is not configured yet.'}</div></div><div class="list">${state.files.map(f=>`<div class="row"><span><b>${esc(f.title)}</b><div class="meta">${esc(f.type)} • ${f.public?'PUBLIC':'PRIVATE'} • ${f.downloadable?'DOWNLOADABLE':'VIEW ONLY'} • ${esc(f.name||'')}</div></span><div class="actions"><button class="btn small" onclick="editFile('${f.id}')">Edit</button><button class="btn small" onclick="togglePublic('files','${f.id}',${!f.public})">${f.public?'Make private':'Make public'}</button><button class="btn small danger" onclick="deleteFile('${f.id}')">Delete</button></div></div>`).join("")||"<p>No archive files.</p>"}</div></div>`}
function githubApi(path,options={}){if(!state.github.token)return Promise.reject(new Error('GitHub token is not configured.'));let headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${state.github.token}`,'X-GitHub-Api-Version':'2026-03-10','Content-Type':'application/json',...(options.headers||{})};return fetch(`https://api.github.com${path}`,{...options,headers}).then(async r=>{let text=await r.text(),data=text?JSON.parse(text):{};if(!r.ok)throw new Error(data.message||`GitHub API error ${r.status}`);return data})}
function saveGithubConfig(){let owner=$('ghOwner').value.trim(),repo=$('ghRepo').value.trim(),branch=$('ghBranch').value.trim()||'main',token=$('ghToken').value.trim();if(!owner||!repo||!token)return alert('Enter the repository owner, repository name, branch and GitHub token.');state.github={owner,repo,branch,token};$('ghStatus').textContent='GitHub storage configured for this tab.';toast('GitHub storage connection ready.')}
function clearGithubToken(){state.github.token='';if($('ghToken'))$('ghToken').value='';if($('ghStatus'))$('ghStatus').textContent='GitHub token cleared from this tab.'}
window.saveGithubConfig=saveGithubConfig;window.clearGithubToken=clearGithubToken;
function fileForm(f={}){return `<div class="modal-head"><h2>${f.id?'Edit archive record':'Add archive file'}</h2><button class="btn small" onclick="closeModal()">Close</button></div><div class="field"><label>Title</label><input id="fTitle" value="${esc(f.title||'')}"></div><div class="field"><label>Description</label><textarea id="fDesc">${esc(f.description||'')}</textarea></div><div class="two"><div class="field"><label>Type</label><select id="fType">${['image','pdf','video','audio','text','other'].map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Visibility</label><select id="fPublic"><option value="true" ${f.public!==false?'selected':''}>Public</option><option value="false" ${f.public===false?'selected':''}>Private</option></select></div></div><div class="field"><label>${f.name?'Replace file (current: '+esc(f.name)+')':'Choose file to upload'}</label><input id="fFile" type="file"></div><label class="toolbar-note"><input id="fDownload" type="checkbox" ${f.downloadable?'checked':''}> Allow download</label><div id="fileUploadStatus" class="toolbar-note" style="margin-top:10px"></div><br><button class="btn primary" onclick="saveFile('${f.id||''}')">${f.id?'Save archive record':'Upload archive file'}</button>`}
window.newFile=()=>showModal(fileForm());window.editFile=id=>{let f=state.files.find(x=>x.id===id);if(f)showModal(fileForm(f))};
function bytesToBase64(buffer){let bytes=new Uint8Array(buffer),chunk=0x8000,out='';for(let i=0;i<bytes.length;i+=chunk)out+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(out)}
async function githubPutFile(path,content,message,sha=''){let body={message,content,branch:state.github.branch||'main'};if(sha)body.sha=sha;return githubApi(`/repos/${encodeURIComponent(state.github.owner)}/${encodeURIComponent(state.github.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'PUT',body:JSON.stringify(body)})}
async function githubDeleteFile(path,sha,message){return githubApi(`/repos/${encodeURIComponent(state.github.owner)}/${encodeURIComponent(state.github.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'DELETE',body:JSON.stringify({message,sha,branch:state.github.branch||'main'})})}
window.saveFile=async id=>{let old=id?state.files.find(x=>x.id===id):null,file=$('fFile').files[0],status=$('fileUploadStatus');try{if(!state.github.owner||!state.github.repo||!state.github.token)return alert('Configure GitHub storage first in the Archive files section.');let data={title:$('fTitle').value.trim()||file?.name||old?.title||'Untitled file',description:$('fDesc').value,type:$('fType').value,public:$('fPublic').value==='true',downloadable:$('fDownload').checked,updatedAt:serverTimestamp()};if(file){if(status)status.textContent='Reading file…';let base64=bytesToBase64(await file.arrayBuffer());let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`archive/${Date.now()}_${safe}`;if(status)status.textContent='Uploading to GitHub…';let result=await githubPutFile(path,base64,`${old?'Replace':'Add'} archive file: ${data.title}`);data.githubPath=path;data.githubSha=result.content.sha;data.url=`https://raw.githubusercontent.com/${encodeURIComponent(state.github.owner)}/${encodeURIComponent(state.github.repo)}/${encodeURIComponent(state.github.branch||'main')}/${path.split('/').map(encodeURIComponent).join('/')}`;data.name=file.name;data.mimeType=file.type;data.size=file.size;if(old?.githubPath&&old?.githubSha)await githubDeleteFile(old.githubPath,old.githubSha,`Remove old archive file: ${old.title}`).catch(()=>{});}else if(old){Object.assign(data,{url:old.url,githubPath:old.githubPath,githubSha:old.githubSha,name:old.name,mimeType:old.mimeType,size:old.size})}else return alert('Choose a file to upload.');if(id)await updateDoc(doc(db,'files',id),data);else await addDoc(collection(db,'files'),{...data,createdAt:serverTimestamp()});closeModal();await loadAll();toast('Archive record saved to GitHub.')}catch(e){console.error(e);if(status)status.textContent='Upload failed: '+e.message;alert(e.message)}};
window.deleteFile=async id=>{if(!confirm('Delete this archive item and its GitHub file?'))return;try{let f=state.files.find(x=>x.id===id);if(f?.githubPath&&f?.githubSha){if(!state.github.token)return alert('Configure your GitHub token first.');await githubDeleteFile(f.githubPath,f.githubSha,`Delete archive file: ${f.title}`)}await deleteDoc(doc(db,'files',id));await loadAll();toast('Archive item deleted.')}catch(e){alert(e.message)}};
function eventForm(e={}){return `<div class="modal-head"><h2>${e.id?'Edit event':'New event'}</h2><button class="btn small" onclick="closeModal()">Close</button></div><div class="field"><label>Event title</label><input id="eTitle" value="${esc(e.title||'')}"></div><div class="two"><div class="field"><label>Date</label><input id="eDate" type="date" value="${esc(e.date||today())}"></div><div class="field"><label>Visibility</label><select id="ePublic"><option value="true" ${e.public!==false?'selected':''}>Public</option><option value="false" ${e.public===false?'selected':''}>Private</option></select></div></div><div class="field"><label>Notes</label><textarea id="eNotes">${esc(e.notes||'')}</textarea></div><button class="btn primary" onclick="saveEvent('${e.id||''}')">Save event</button>`}window.newEvent=()=>showModal(eventForm());window.editEvent=id=>{let e=state.events.find(x=>x.id===id);if(e)showModal(eventForm(e))};window.saveEvent=async id=>{let data={title:eTitle.value.trim()||'Untitled event',date:eDate.value,public:ePublic.value==='true',notes:eNotes.value,updatedAt:serverTimestamp()};if(id)await updateDoc(doc(db,'events',id),data);else await addDoc(collection(db,'events'),{...data,createdAt:serverTimestamp()});closeModal();toast('Event saved.')};window.deleteEvent=async id=>{if(confirm('Delete this event?')){await deleteDoc(doc(db,'events',id));toast('Event deleted.')}};
function pageForm(p={}){return `<div class="modal-head"><h2>${p.id?'Edit page':'New custom page'}</h2><button class="btn small" onclick="closeModal()">Close</button></div><div class="field"><label>Page title</label><input id="pTitle" value="${esc(p.title||'')}"></div><div class="field"><label>URL slug</label><input id="pSlug" value="${esc(p.slug||'')}" placeholder="example-page"></div><div class="two"><div class="field"><label>Visibility</label><select id="pPublic"><option value="true" ${p.public!==false?'selected':''}>Public</option><option value="false" ${p.public===false?'selected':''}>Private</option></select></div><div class="field"><label>Navigation</label><select id="pNav"><option value="true" ${p.nav!==false?'selected':''}>Show in navigation</option><option value="false" ${p.nav===false?'selected':''}>Hide from navigation</option></select></div></div><div class="field"><label>Page content</label>${richField('pBody',p.body||'')}</div><button class="btn primary" onclick="savePage('${p.id||''}')">Save page</button>`}window.newPage=()=>showModal(pageForm());window.editPage=id=>{let p=state.pages.find(x=>x.id===id);if(p)showModal(pageForm(p))};window.savePage=async id=>{let slug=slugify(pSlug.value||pTitle.value);let data={title:pTitle.value.trim()||'Untitled page',slug,public:pPublic.value==='true',nav:pNav.value==='true',body:pBody.innerHTML,updatedAt:serverTimestamp()};if(id)await updateDoc(doc(db,'pages',id),data);else await addDoc(collection(db,'pages'),{...data,createdAt:serverTimestamp()});closeModal();toast('Page saved.')};window.deletePage=async id=>{if(confirm('Delete this page?')){await deleteDoc(doc(db,'pages',id));toast('Page deleted.')}};
function navLinkForm(l={}){return `<div class="modal-head"><h2>${l.id?'Edit navigation link':'New navigation link'}</h2><button class="btn small" onclick="closeModal()">Close</button></div><div class="field"><label>Label</label><input id="lTitle" value="${esc(l.title||'')}"></div><div class="field"><label>URL</label><input id="lUrl" value="${esc(l.url||'')}" placeholder="https://example.com or #about"></div><label class="toolbar-note"><input id="lShow" type="checkbox" ${l.show!==false?'checked':''}> Show in navigation</label><br><br><button class="btn primary" onclick="saveNavLink('${l.id||''}')">Save link</button>`}window.newNavLink=()=>showModal(navLinkForm());window.editNavLink=id=>{let l=state.links.find(x=>x.id===id);if(l)showModal(navLinkForm(l))};window.saveNavLink=async id=>{let data={title:lTitle.value.trim()||'Link',url:lUrl.value.trim()||'#',show:lShow.checked,updatedAt:serverTimestamp()};if(id)await updateDoc(doc(db,'links',id),data);else await addDoc(collection(db,'links'),{...data,createdAt:serverTimestamp()});closeModal();toast('Navigation link saved.')};window.deleteNavLink=async id=>{if(confirm('Delete this link?')){await deleteDoc(doc(db,'links',id));toast('Link deleted.')}};
window.saveSite=async()=>{let data={title:sTitle.value||'Personal Archive',subtitle:sSubtitle.value||'',footer:sFooter.value||'',footerRight:sFooterRight.value||'',notice:{show:sNoticeShow.checked,text:sNotice.value||''},about:sAbout.innerHTML,contact:sContact.innerHTML,updatedAt:serverTimestamp()};await setDoc(doc(db,'settings','site'),data,{merge:true});toast('Site content saved.')};
window.changeUsername=async()=>{let nu=curUser.value.trim();if(!nu||nu===state.admin.username)return;try{let newEmail=authEmail(nu);await updateEmail(auth.currentUser,newEmail);await setDoc(doc(db,'admins',auth.currentUser.uid),{username:nu,email:newEmail,updatedAt:serverTimestamp()},{merge:true});state.admin.username=nu;toast('Username changed.')}catch(e){alert(e.message)}};
window.changePassword=async()=>{let old=oldPass.value,n1=newPass.value,n2=newPass2.value;if(n1.length<6||n1!==n2)return alert('New password must be at least 6 characters and match confirmation.');try{let c=EmailAuthProvider.credential(auth.currentUser.email,old);await reauthenticateWithCredential(auth.currentUser,c);await updatePassword(auth.currentUser,n1);toast('Password changed.')}catch(e){alert(e.message)}};
window.setupAdmin=async()=>{let u=setupUser.value.trim(),p=setupPass.value;if(!u||p.length<6||p!==setupPass2.value)return alert('Enter a username and a matching password of at least 6 characters.');try{let existing=await getDoc(doc(db,'system','setup'));if(existing.exists()&&existing.data().initialized)return alert('Administrator is already initialized.');let email=authEmail(u),cred=await createUserWithEmailAndPassword(auth,email,p);await setDoc(doc(db,'admins',cred.user.uid),{username:u,email,role:'admin',createdAt:serverTimestamp()});await setDoc(doc(db,'system','setup'),{initialized:true,adminUid:cred.user.uid,updatedAt:serverTimestamp()},{merge:true});toast('Administrator created.')}catch(e){alert(e.message)}};
window.loginAdmin=async()=>{try{let u=loginUser.value.trim(),p=loginPass.value;await signInWithEmailAndPassword(auth,authEmail(u),p);toast('Signed in.')}catch(e){alert('Invalid username or password.')}};window.logoutAdmin=async()=>{await signOut(auth);state.admin=null;go('home')};
async function loadAll(){try{let [settings,arts,files,events,pages,links]=await Promise.all([getDoc(doc(db,'settings','site')),getDocs(collection(db,'articles')),getDocs(collection(db,'files')),getDocs(collection(db,'events')),getDocs(collection(db,'pages')),getDocs(collection(db,'links'))]);if(settings.exists())state.settings={...state.settings,...settings.data()};state.articles=arts.docs.map(d=>({id:d.id,...d.data()}));state.files=files.docs.map(d=>({id:d.id,...d.data()}));state.events=events.docs.map(d=>({id:d.id,...d.data()}));state.pages=pages.docs.map(d=>({id:d.id,...d.data()}));state.links=links.docs.map(d=>({id:d.id,...d.data()}));state.ready=true;render()}catch(e){console.error(e);$("home").innerHTML=`<div class="panel"><h2>Firebase connection error</h2><p>${esc(e.message)}</p><p class="toolbar-note">Check that Firestore is enabled and that your Firebase Security Rules allow the intended operations. GitHub archive storage is configured from the Admin > Archive files section.</p></div>`}}
function render(){document.title=state.settings.title||'Personal Archive';$("siteTitle").textContent=state.settings.title||'Personal Archive';$("siteSubtitle").textContent=state.settings.subtitle||'';$("footerLeft").textContent=state.settings.footer||'';$("footerRight").textContent=state.settings.footerRight||'Archive interface';$("notice").classList.toggle('show',!!state.settings.notice?.show);$("noticeText").textContent=state.settings.notice?.text||'';renderNav();if(state.currentPage==='home')renderHome();else if(state.currentPage==='articles')renderArticles();else if(state.currentPage==='archive')renderArchive();else if(state.currentPage==='calendar')renderCalendar();else if(state.currentPage==='about')renderAbout();else if(state.currentPage==='contact')renderContact();else if(state.currentPage==='searchPage')renderSearch();else if(state.currentPage.startsWith('page:'))renderDynamic();else if(state.currentPage==='admin'){$("admin").innerHTML=state.ready?(state.admin?adminHTML():((state.setupExists===false)?adminSetup():adminLogin())):'<div class="loading">Connecting to Firebase…</div>';if(state.admin)bindAdmin()}}
async function checkAdmin(user){if(!user){state.admin=null;return}let s=await getDoc(doc(db,'admins',user.uid));state.admin=s.exists()?{id:user.uid,...s.data()}:null}
onAuthStateChanged(auth,async user=>{try{await checkAdmin(user);let setup=await getDoc(doc(db,'system','setup'));state.setupExists=setup.exists()&&setup.data().initialized;state.ready=true;render()}catch(e){console.error(e)}});
await loadAll();
window.addEventListener('hashchange',()=>{let h=location.hash.slice(1);if(h.startsWith('article/'))openArticle(h.slice(8));else if(h.startsWith('page/'))go('page:'+h.slice(5));else if(['about','contact'].includes(h))go(h)});
</script>
</body></html>
